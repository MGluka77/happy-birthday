<html><body style="margin:0">
<div id="a" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:red;z-index:1"></div>
<div id="b" style="position:fixed;top:0;left:0;width:100vw;height:100%;background:blue;z-index:2"></div>
<pre id="d" style="position:fixed;bottom:0;left:0;z-index:9;color:#0f0;background:#000;font-size:14px">measuring...</pre>
<script>
setTimeout(function(){
  document.getElementById('d').textContent = 
    'innerH=' + window.innerHeight + 
    ' 100vh=' + getComputedStyle(document.documentElement).fontSize +
    ' a_h=' + document.getElementById('a').getBoundingClientRect().height +
    ' b_h=' + document.getElementById('b').getBoundingClientRect().height;
}, 1000);
</script></body></html>
